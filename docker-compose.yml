services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fabrica
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fabrica_dev}
      POSTGRES_DB: fabrica_magica
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrica -d fabrica_magica"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
