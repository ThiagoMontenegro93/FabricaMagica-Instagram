name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fabrica
          POSTGRES_PASSWORD: fabrica_ci
          POSTGRES_DB: fabrica_magica
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fabrica -d fabrica_magica"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fabrica:fabrica_ci@localhost:5432/fabrica_magica?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrações aplicam em banco limpo
        run: pnpm db:deploy
      - name: Seed é idempotente
        run: pnpm db:seed && pnpm db:seed
