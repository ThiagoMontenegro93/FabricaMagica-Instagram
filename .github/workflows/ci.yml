name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fabrica
          POSTGRES_PASSWORD: fabrica_ci
          POSTGRES_DB: fabrica_magica_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fabrica -d fabrica_magica_test"
          --health-interval 5s --health-retries 10
    env:
      # O nome do banco precisa conter "test": os testes de integração apagam os dados.
      DATABASE_URL: postgresql://fabrica:fabrica_ci@localhost:5432/fabrica_magica_test?schema=public
      JWT_SECRET: segredo-somente-para-o-ci-com-mais-de-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - name: Migrações aplicam em banco limpo
        run: pnpm db:deploy
      - name: Seed é idempotente
        run: pnpm db:seed && pnpm db:seed
      - name: Testes (regras + integração das rotas no Postgres)
        run: pnpm test
      - name: Build de produção do web
        run: pnpm --filter @fabrica/web build
